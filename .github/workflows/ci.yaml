name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  ci-check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [auth, tournament]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.16'
        cache: 'npm'
        cache-dependency-path: ./${{ matrix.service }}/package-lock.json

    - name: Install Dependencies
      working-directory: ./${{ matrix.service }}
      run: npm ci

    - name: Build Project
      working-directory: ./${{ matrix.service }}
      run: npm run build --if-present

    - name: Test Docker Build
      run: docker build ./${{ matrix.service }} -t test-image